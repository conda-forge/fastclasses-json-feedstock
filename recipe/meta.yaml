{% set python_min = "3.8" %}
{% set name = "fastclasses-json" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 2a80a8e4ced7868718277b76f399d050ed6c1e1c17210ba624db3766ae83c850

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - typing-extensions

test:
  imports:
    - fastclasses_json
  commands:
    - pip check
    - pytest
  source_files:
    - .
  requires:
    - pip
    - python {{ python_min }}
    - pytest

about:
  home: https://github.com/cakemanny/fastclasses-json
  summary: Quickly serialize dataclasses to and from JSON
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - julian-belina
